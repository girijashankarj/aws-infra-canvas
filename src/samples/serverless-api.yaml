AWSTemplateFormatVersion: '2010-09-09'
Description: A serverless HTTP API backed by DynamoDB, with async work on a queue.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-items'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  WorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600

  EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: item-events

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 14

  # The HTTP entry point.
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: nodejs20.x
      Handler: index.handler
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          STAGE: !Ref Stage
          TABLE_NAME: !Ref ItemsTable
          QUEUE_URL: !Ref WorkQueue
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: '{}' });

  # Drains the queue and fans out to the topic.
  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: worker.handler
      MemorySize: 256
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          TABLE_ARN: !GetAtt ItemsTable.Arn
          TOPIC_ARN: !Ref EventsTopic

  WorkerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt WorkQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 10

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http'
      ProtocolType: HTTP
      Target: !GetAtt ApiFunction.Arn

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
